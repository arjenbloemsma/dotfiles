# Colours are inspired by Catppuccin Macchiato.
# Green marks the active window in the list.

set -g status-style "bg=#1e2030,fg=#b8c0e0"
set -g window-status-current-style "fg=#a6da95,bold"
set -g window-status-style "fg=#6e738d"
set -g pane-active-border-style "fg=#5b6078"
set -g pane-border-style "fg=#363a4f"
set -g message-style "bg=#363a4f,fg=#cad3f5"

# Show the window list and nothing else. The defaults add the session name on
# the left and the pane title and a clock on the right.
set -g status-left ""
set -g status-right ""
