# Reload config in a snap
unbind r
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "Tmux config reloaded 🎉"
# Set default terminal
set-option -g default-terminal "tmux-256color"
# Set vim mode
set -g mode-keys vi
# Set bindings to adjust default copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# move OSX clipboard into tmux copy buffer
bind C-c run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"
# move tmux copy buffer into OSX clipboard
bind C-y run "tmux show-buffer | pbcopy"
# Set Shift Alt vim like bindings to adjust pane sizes
# Disabled to prevent Alt/Option key interception in nvim (never use for resizing anyway)
# bind -n M-H resize-pane -L 4
# bind -n M-J resize-pane -D 4
# bind -n M-K resize-pane -U 4
# bind -n M-L resize-pane -R 4
# Shift Alt to switch windows
bind -n M-P previous-window
bind -n M-N next-window
# Clear screen
bind C-l send-keys 'C-l'

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Plugin options (must be set BEFORE loading plugins)
# Continuum
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'
set -g @continuum-save-status 'off'  # Don't modify status bar

# Catppuccin (must be set BEFORE plugin loads)
set -g @catppuccin_flavor 'macchiato' # or frappe, latte, mocha

# Window styling - rounded pills (don't set separators here, let rounded style handle it)
set -g @catppuccin_window_status_style "rounded"
set -g window-status-separator " "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_number "#I"

# Status line styling - rounded pills
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_directory_text " #{b:pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

# The following 3 lines are required by Yazi and Überzug++
# for rendering image previews
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Set plugin manager path respecting XDG_CONFIG_HOME
# Use run-shell to evaluate shell variables (tmux can't expand them directly)
# ${XDG_CONFIG_HOME:-$HOME/.config} uses XDG_CONFIG_HOME if set, otherwise $HOME/.config
# This ensures catppuccin and other plugins load correctly
run-shell 'tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Status line configuration (must be AFTER plugin loads)
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory} #{E:@catppuccin_status_session} #{E:@catppuccin_status_date_time}"
set -g status-right-length 100
