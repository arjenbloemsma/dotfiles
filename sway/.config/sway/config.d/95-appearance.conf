# Window appearance: dark fuchsia focus accent, matching the flat Waybar.
# Columns: border background text indicator child_border

client.focused          #8b3a6b #3a1f30 #ffffff #b8558f #8b3a6b
client.focused_inactive #2a2e37 #1b1e24 #9aa0aa #2a2e37 #2a2e37
client.unfocused        #1b1e24 #16181d #6b7280 #1b1e24 #1b1e24
client.urgent           #eb4d4b #eb4d4b #ffffff #eb4d4b #eb4d4b

# No titlebars. The border colour shows which window is focused.
default_border pixel 2

